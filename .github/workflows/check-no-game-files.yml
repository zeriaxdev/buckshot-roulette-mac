name: No game files
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Table geometry preserves the owner's mesh data
        run: |
          curl -fsSL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o "$RUNNER_TEMP/godot.zip"
          echo "ef4e76880a514257175544952c61191106fdef3095b909bafed9fcbeb230c3e5533920a0f3012882dd4bbde83028a67549825794e2d2c3cf76eba7918b71370e  $RUNNER_TEMP/godot.zip" | sha512sum --check
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          mkdir "$RUNNER_TEMP/br-geometry"
          printf 'config_version=5\n' > "$RUNNER_TEMP/br-geometry/project.godot"
          "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" --headless --path "$RUNNER_TEMP/br-geometry" --script "$GITHUB_WORKSPACE/tests/table_geometry.gd" -- "$GITHUB_WORKSPACE/tools/screen_fit.gd"
      - name: Repository has no game files
        run: python3 scripts/check_no_game_files.py
      - name: Release ZIP would have no game files
        run: |
          git archive --format=zip -o release-check.zip HEAD
          python3 scripts/check_no_game_files.py --zip release-check.zip
